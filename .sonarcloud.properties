# SonarCloud Automatic Analysis settings for this repo.
#
# Exclude skill eval fixtures from static analysis. These directories contain
# intentionally-flawed code -- unused variables, weak hashing, missing null
# checks, and similar -- planted as test data so a skill under test (e.g.
# resolve-sonarqube-issues, review-code) can be evaluated on whether it finds
# and handles them correctly. Scanning them as if they were production code
# produces findings that would be wrong to "fix" (doing so breaks the eval
# the finding is testing) and wrong to individually suppress one at a time,
# since every new eval fixture would need the same treatment.
sonar.exclusions=plugins/*/skills/*/evals/fixtures/**

# The MCP stub servers in evals/lib/mcp-stub deliberately replicate the
# EXACT parameter names of the real third-party MCP tools they stand in for
# (e.g. the Gmail MCP's camelCase threadId/pageSize/messageFormat). That
# schema fidelity is the design's core guarantee: a renamed parameter would
# make a skill's real tool calls silently fail to match the stub. Suppress
# only the naming-convention rule (python:S117), only for the stub modules;
# every other rule still applies to them (approved 2026-07-31).
# The same rationale covers function names (python:S1542): a stub's tool
# functions ARE the exposed MCP tool names, so getJiraIssue cannot become
# get_jira_issue without breaking every real call. Note: SonarCloud's
# Automatic Analysis appears not to honor issue.ignore.multicriteria (the
# S117 findings still surfaced with this file present), so the stubs also
# carry per-line NOSONAR markers on their tool definitions; these entries
# remain as the declarative record and for any future scanner-based setup.
# Parameter COUNT is the same guarantee as parameter names (python:S107).
# slack_search_public_and_private declares the live Slack tool's 15 search
# parameters against a limit of 13, and that list IS the tool's
# introspectable schema: the MCP SDK derives the published schema from the
# Python signature and offers no override, so collapsing the tail into
# **kwargs would drop those fields from the schema entirely and a skill
# calling one of them would fail against the stub while succeeding live.
# Scoped to the one file that needs it rather than the stub glob, so a
# future stub growing an unjustified signature is still flagged. Same
# rationale as the S107 exclusion for **/contacts.py in
# dcwalker/google-gap-fill-mcp (approved 2026-08-13).
sonar.issue.ignore.multicriteria=stubparams,stubfuncs,slackparamcount
sonar.issue.ignore.multicriteria.stubparams.ruleKey=python:S117
sonar.issue.ignore.multicriteria.stubparams.resourceKey=evals/lib/mcp-stub/*_stub.py
sonar.issue.ignore.multicriteria.stubfuncs.ruleKey=python:S1542
sonar.issue.ignore.multicriteria.stubfuncs.resourceKey=evals/lib/mcp-stub/*_stub.py
sonar.issue.ignore.multicriteria.slackparamcount.ruleKey=python:S107
sonar.issue.ignore.multicriteria.slackparamcount.resourceKey=**/slack_stub.py
