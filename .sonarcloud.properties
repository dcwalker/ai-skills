# SonarCloud Automatic Analysis settings for this repo.
#
# Exclude skill eval fixtures from static analysis. These directories contain
# intentionally-flawed code -- unused variables, weak hashing, missing null
# checks, and similar -- planted as test data so a skill under test (e.g.
# resolve-sonarqube-issues, review-code) can be evaluated on whether it finds
# and handles them correctly. Scanning them as if they were production code
# produces findings that would be wrong to "fix" (doing so breaks the eval
# the finding is testing) and wrong to individually suppress one at a time,
# since every new eval fixture would need the same treatment.
sonar.exclusions=plugins/*/skills/*/evals/fixtures/**
