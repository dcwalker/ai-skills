# SonarCloud Automatic Analysis settings for this repo.
#
# Exclude skill eval fixtures from static analysis. These directories contain
# intentionally-flawed code -- unused variables, weak hashing, missing null
# checks, and similar -- planted as test data so a skill under test (e.g.
# resolve-sonarqube-issues, review-code) can be evaluated on whether it finds
# and handles them correctly. Scanning them as if they were production code
# produces findings that would be wrong to "fix" (doing so breaks the eval
# the finding is testing) and wrong to individually suppress one at a time,
# since every new eval fixture would need the same treatment.
sonar.exclusions=plugins/*/skills/*/evals/fixtures/**

# The MCP stub servers in evals/lib/mcp-stub deliberately replicate the
# EXACT parameter names of the real third-party MCP tools they stand in for
# (e.g. the Gmail MCP's camelCase threadId/pageSize/messageFormat). That
# schema fidelity is the design's core guarantee: a renamed parameter would
# make a skill's real tool calls silently fail to match the stub. Suppress
# only the naming-convention rule (python:S117), only for the stub modules;
# every other rule still applies to them (approved 2026-07-31).
sonar.issue.ignore.multicriteria=stubparams
sonar.issue.ignore.multicriteria.stubparams.ruleKey=python:S117
sonar.issue.ignore.multicriteria.stubparams.resourceKey=evals/lib/mcp-stub/*_stub.py
